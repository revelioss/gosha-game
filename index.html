<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>GOSHA GAME</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Cache-Control" content="no-cache">
	<style>html,body{margin:0;height:100%;background:#1f2d5c;color:#ffd23f;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
	<a href="v6/" style="color:#ffd23f">GOSHA GAME</a>
	<script>
	// Current game build lives in a versioned folder so browsers never mix old cached files with new ones.
	(function () {
		var target = "v6/";
		function go() { location.replace(target); }
		try {
			if (!("serviceWorker" in navigator)) return go();
			navigator.serviceWorker.getRegistrations().then(function (regs) {
				return Promise.all(regs.map(function (r) { return r.unregister(); }));
			}).then(function () {
				return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null;
			}).then(go, go);
			setTimeout(go, 2500);
		} catch (e) { go(); }
	})();
	</script>
</body>
</html>
